name: Update Kinopoisk
on:
  schedule: [{cron: "0 5 * * *"}]     # каждый день в 08:00 МСК
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python kp_parser.py --out docs/kp.json
      - run: |
          git config user.name  "kp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/kp.json
          git commit -m "update kp.json" || echo "no changes"
          git push
